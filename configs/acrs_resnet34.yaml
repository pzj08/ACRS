model: ACRS_ResNet34
model_args:
  feat_dim: 80
  embed_dim: 256
  pooling_func: ACRS
  two_emb_layer: true
  acrs_args:
    age_bins: [18, 25, 35, 45, 55, 65]
    ignore_age_index: -1
    num_posterior_bins: 4
    losses:
      lambda_age: 0.05
      lambda_consistency: 0.02
      lambda_path: 0.0
      ramp_epoch: 2.0
      training_counterfactual: false
      consistency_schedule: null
    ablation:
      mode: none
