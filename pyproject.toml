[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acrs-casv"
version = "0.1.0"
description = "Age-Conditioned Residual Suppression for cross-age speaker verification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "pzj"}]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["acrs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
